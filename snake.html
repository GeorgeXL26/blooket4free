    <script>
        const COIN_TO_BLOOK_RATE = 20;
        const GRID_SIZE = 20;
        const TILE_COUNT = 20;

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let snake, dir, nextDir, food, eaten, best, tickHandle, running;

        function loadBest() {
            const raw = parseInt(localStorage.getItem("snakeBestCoins"), 10);
            return Number.isFinite(raw) && raw >= 0 ? raw : 0;
        }

        function saveBest(n) {
            localStorage.setItem("snakeBestCoins", String(n));
        }

        function randomFood() {
            let pos;
            do {
                pos = {
                    x: Math.floor(Math.random() * TILE_COUNT),
                    y: Math.floor(Math.random() * TILE_COUNT),
                };
            } while (snake.some(s => s.x === pos.x && s.y === pos.y));
            return pos;
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
            dir = { x: 1, y: 0 };
            nextDir = { x: 1, y: 0 };
            food = randomFood();
            eaten = 0;
            best = loadBest();
            running = true;
            document.getElementById("eatenCount").innerText = eaten;
            document.getElementById("bestCount").innerText = best;
            document.getElementById("gameOverCard").classList.remove("active");
            if (tickHandle) clearInterval(tickHandle);
            tickHandle = setInterval(tick, 110);
        }

        function endGame() {
            running = false;
            clearInterval(tickHandle);
            if (eaten > best) {
                best = eaten;
                saveBest(best);
            }
            document.getElementById("bestCount").innerText = best;
            document.getElementById("finalEaten").innerText = eaten;
            document.getElementById("finalEarned").innerText = (eaten * COIN_TO_BLOOK_RATE).toLocaleString();
            document.getElementById("gameOverCard").classList.add("active");
        }

        function tick() {
            dir = nextDir;
            const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                endGame();
                return;
            }
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                eaten += 1;
                document.getElementById("eatenCount").innerText = eaten;
                addCoins(COIN_TO_BLOOK_RATE);
                food = randomFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.fillStyle = "#0b0b18";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ffd24d";
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                GRID_SIZE / 2.6,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.strokeStyle = "#b88400";
            ctx.lineWidth = 2;
            ctx.stroke();

            snake.forEach((seg, i) => {
                ctx.fillStyle = i === 0 ? "#2ecc40" : "#27ae34";
                ctx.fillRect(seg.x * GRID_SIZE + 1, seg.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
            });
        }

        const KEY_DIRS = {
            ArrowUp: { x: 0, y: -1 },
            ArrowDown: { x: 0, y: 1 },
            ArrowLeft: { x: -1, y: 0 },
            ArrowRight: { x: 1, y: 0 },
            w: { x: 0, y: -1 },
            s: { x: 0, y: 1 },
            a: { x: -1, y: 0 },
            d: { x: 1, y: 0 },
        };

        document.addEventListener("keydown", (e) => {
            const want = KEY_DIRS[e.key];
            if (!want) return;
            e.preventDefault();
            if (!running) return;
            if (want.x === -dir.x && want.y === -dir.y) return;
            nextDir = want;
        });

        document.getElementById("restartBtn").addEventListener("click", resetGame);

        resetGame();
        draw();

        function updateCoinBadge(coins) {
            document.getElementById("coinAmount").innerText = (coins ?? getCoins()).toLocaleString();
        }
        updateCoinBadge();
        onCoinsChanged(updateCoinBadge);
    </script>

    <script>

        }

        function closeSidebarMenu() {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        }

        hamburgerBtn.addEventListener('click', openSidebar);
        overlay.addEventListener('click', closeSidebarMenu);
